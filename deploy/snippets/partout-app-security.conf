# PartOut — Flutter web (/app) security extras (nginx snippet).
# Install to: /etc/nginx/snippets/partout-app-security.conf
#
# Include TOGETHER WITH partout-common-security.conf in every /app location
# that declares add_header. (55b115bd items 1+3.)
#
# P3 ships REPORT-ONLY. After the Google sign-in + CanvasKit pass, enforce by
# swapping the header name of the CSP line to Content-Security-Policy (the
# string is identical) and run deploy_check.sh CHECK_APP=1 CSP_MODE=enforce.
# No report-uri/report-to is set: with no collector it only logs to the
# console, and an external one would break the no-third-party posture —
# operator/po-security decision if a server-side collector is ever wanted.
# NO Cross-Origin-Embedder-Policy until sign-in + CanvasKit are verified.

add_header X-Robots-Tag "noindex, nofollow" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Content-Security-Policy-Report-Only "default-src 'self' 'wasm-unsafe-eval'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https://accounts.google.com; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# The enforce step swaps ONLY the header name; check_deploy_template.py rule 6
# fails the build if these two strings ever diverge:
# add_header Content-Security-Policy "default-src 'self' 'wasm-unsafe-eval'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https://accounts.google.com; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
