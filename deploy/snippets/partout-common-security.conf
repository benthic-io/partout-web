# PartOut — common security header matrix (nginx snippet).
# Install to: /etc/nginx/snippets/partout-common-security.conf
#
# Because nginx add_header does NOT inherit into any block that declares its
# own add_header, EVERY header-adding location in deploy/nginx-site.conf.example
# includes this file at its own level. New add_header locations MUST include
# it too (cf0d322b HIGH, 55b115bd HIGH; scripts/check_deploy_template.py lints
# it and CI runs it).

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
