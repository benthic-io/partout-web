name: site

# Prove the site builds and its generated/duplicated inputs are honest:
# brand.css must match theme.dart, image copies must match partout-app/assets,
# hugo must build clean, the key pages must exist, and no secret material may
# appear anywhere in the tree. Mirrors the benthic-site docs.yml posture.
#
# Third-party actions are pinned by COMMIT SHA (po-security handoff
# cee9848a): tags are movable, SHAs are auditable. Update deliberately:
#   actions/checkout        v4.2.2
#   actions/setup-python    v5.6.0
#   peaceiris/actions-hugo  v3.2.1 (hugo extended 0.169.0)

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The brand drift checks read ../partout-app. The app repo is private:
      # if the job token cannot read it, the skip must be VISIBLE — a warning
      # in the log plus a job-summary banner, never a silent green.
      - name: Fetch app repo for source-of-truth comparison
        run: |
          if git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/benthic-io/partout-app" ../partout-app 2>/dev/null; then
            echo "APP_REPO=1" >> "$GITHUB_ENV"
          else
            echo "warning: partout-app not fetchable with GITHUB_TOKEN — brand drift checks SKIPPED (not passed). Grant cross-repo Actions read, or these checks stay authoritative only locally."
            echo "## ⚠️ Brand drift checks SKIPPED — private partout-app not fetchable with GITHUB_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            echo "APP_REPO=0" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: brand.css must match the app theme
        run: |
          if [ "$APP_REPO" = 1 ]; then python scripts/gen_brand_css.py --check; else echo "SKIPPED (see summary)"; fi

      - name: brand images must match the app assets
        run: |
          if [ "$APP_REPO" = 1 ]; then bash scripts/sync_assets.sh --check; else echo "SKIPPED (see summary)"; fi

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Key pages exist
        run: |
          test -f public/index.html
          test -f public/how-it-works/index.html
          test -f public/obtain/index.html
          test -f public/404.html
          test -f public/css/brand.css
          test -f public/css/style.css
          test -f public/images/banner.png

      - name: robots.txt present and disallows app surfaces
        run: |
          test -f public/robots.txt
          grep -q 'Disallow: /app/' public/robots.txt
          grep -q 'Disallow: /admin' public/robots.txt

      # Strict CSP stays achievable only while the site ships no inline
      # script/style/handlers (po-security handoff cee9848a P1 item 4).
      - name: No inline scripts or styles (strict-CSP readiness)
        run: |
          ! grep -REq '<script|javascript:| style="| onclick=| onload=' \
            --include='*.html' public

      - name: No secret material in the tree
        run: |
          ! grep -rIE 'client_secret|BEGIN [A-Z ]*PRIVATE KEY|JWT_SECRET\s*[:=]\s*[A-Za-z0-9]' \
            --exclude-dir=.git --exclude-dir=public .
