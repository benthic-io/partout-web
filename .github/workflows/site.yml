name: site

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Expected pages exist
        run: |
          test -f public/index.html
          test -f public/404.html
          test -f public/css/brand.css
          test -f public/css/style.css
          test -f public/images/banner.png
          test -f public/robots.txt
          # Single-page site: retired pages must not reappear.
          test ! -e public/how-it-works/index.html
          test ! -e public/obtain/index.html

      - name: No inline scripts or styles (strict-CSP readiness)
        run: |
          ! grep -REiq --include='*.html' -- "<script|javascript:|[[:space:]]on[a-z]+=[\"']|[[:space:]]style=[\"']" public
