<!doctype html>
<html lang="{{ .Site.Language.Locale }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ if .IsHome }}PartOut — Parts are Everywhere{{ else }}{{ .Title }} — PartOut{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/brand.css" | relURL }}" />
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}" />
    <link rel="icon" href="{{ "favicon.png" | relURL }}" sizes="512x512" type="image/png" />
    {{ partial "seo.html" . }}
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <a class="brand" href="{{ "/" | relURL }}" aria-label="PartOut home">
          <img
            src="{{ "images/banner.png" | relURL }}"
            alt="PartOut"
            width="401"
            height="89"
          />
        </a>
        <nav class="site-nav" aria-label="Main">
          <ul>
            {{ range .Site.Menus.main }}
            <li><a href="{{ .URL | relURL }}">{{ .Name }}</a></li>
            {{ end }}
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">{{ block "main" . }}{{ end }}</main>

    <footer class="site-footer">
      <div class="container">
        <p>
          &copy; {{ now.Year }} PartOut — a benthic.io project. Crowd-sourced
          parts matching and data generation, for the public good.
        </p>
        <p>
          <a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a>
          ·
          <a href="https://benthic.io">benthic.io</a>
        </p>
      </div>
    </footer>
  </body>
</html>
